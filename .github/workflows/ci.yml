name: Roomly CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Typecheck Backend
        run: npm --prefix apps/api run typecheck

      - name: Run Backend Unit & Integration Tests
        run: npm --prefix apps/api test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/roomly_test
          JWT_ACCESS_SECRET: test_secret_key_minimum_32_characters_long_for_tests
          JWT_REFRESH_SECRET: test_refresh_secret_key_minimum_32_chars_long

      - name: Typecheck & Build Frontend
        run: npm --prefix apps/web run build
